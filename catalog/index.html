<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the buildings, props, and destruction sequences of PERMIT DENIED.">
  <title>Asset catalog · PERMIT DENIED</title>
  <meta name="theme-color" content="#222a23">
  <link rel="icon" type="image/x-icon" href="/brand/favicon.ico">
  <meta property="og:title" content="Asset catalog · PERMIT DENIED">
  <meta property="og:description" content="Still gallery from the production renderer. The County Said No.">
  <meta property="og:image" content="/brand/PermitDenied-Logo_521x521.png">
</head>
<body class="site-page">
  <header id="site-header" class="site-header">
    <div class="site-brand" data-site-permit></div>
    <div class="site-titles">
      <p class="site-eyebrow">COUNTY ARCHIVE</p>
      <h1>PERMIT DENIED</h1>
      <p class="tagline">The County Said No.</p>
    </div>
    <nav class="site-nav" aria-label="Site">
      <a href="/">Play</a>
      <a href="/catalog/" aria-current="page">Catalog</a>
      <a href="/designer/">Designer</a>
    </nav>
  </header>
  <main>
    <section class="intro">
      <p>Still gallery from the production renderer. Search a name, ID, or word prefix. Live JSON preview lives on the <a href="/designer/">designer</a>.</p>
      <p id="release" class="release">Connecting to the archive…</p>
    </section>
    <form id="filters" role="search">
      <label>Find an asset<input id="search" type="search" placeholder="Search a name, ID, or word prefix" autocomplete="off"></label>
      <label>Collection<select id="category"><option value="all">All collections</option></select></label>
      <button type="submit">Search</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="grid" class="grid" aria-label="Assets"></section>
    <nav class="pagination" aria-label="Catalog pages">
      <button id="previous" disabled>Previous</button>
      <span id="page-number">Page 1</span>
      <button id="next" disabled>Next</button>
    </nav>
  </main>
  <footer id="site-footer" class="nameplate"></footer>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head"><div><p id="asset-id" class="eyebrow"></p><h2 id="viewer-title">Asset</h2></div><button id="close" aria-label="Close asset viewer">Close</button></div>
    <div class="viewer-options"><label>Variant<select id="variant"></select></label><label>View<select id="series"></select></label><button id="share">Copy link</button></div>
    <p id="explanation"></p>
    <div id="stage" class="stage" tabindex="0" aria-label="Image viewer. Use left and right arrow keys to step through frames."><img id="frame" alt=""><p id="image-status" role="status"></p></div>
    <div class="transport"><button id="back" aria-label="Previous frame">←</button><div><label id="frame-label" for="scrubber"></label><input id="scrubber" type="range" min="0" value="0"><p id="counter"></p></div><button id="forward" aria-label="Next frame">→</button></div>
    <p class="hint">Arrow keys or swipe to step through · Escape to close</p>
  </dialog>
  <script type="module" src="/src/catalog/main.ts"></script>
</body>
</html>
