name: Set up Playwright Chromium
description: >-
  Restores Chromium for the installed Playwright version from the Actions cache, then installs
  the browser on a miss or only its system packages on a hit. Run after npm ci.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
