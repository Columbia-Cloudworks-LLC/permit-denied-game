name: Title Screenshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: title-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture:
    # Never execute fork code with a write token. Capture previews as artifacts; supplied brand images remain authoritative.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the latest branch on retries, including any earlier image commit.
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run screenshot:title
      - uses: actions/upload-artifact@v4
        with:
          name: title-screen
          path: public/social/permit-denied-title.jpg
