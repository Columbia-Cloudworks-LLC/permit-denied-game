name: Asset visual catalog

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      trusted:
        type: boolean
        required: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ inputs.sha }}
  R2_ACCOUNT_ID: d24832efce35cd4904cde1c3b7c5d04a
  R2_PRIVATE_BUCKET: permit-denied-catalog-cache

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8.0.1
        with:
          name: game-build
          path: dist
      - run: node scripts/catalog.mjs plan --output=artifacts/catalog-plans ${{ inputs.trusted && '--cache' || '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: catalog-plans
          path: artifacts/catalog-plans
          retention-days: 14

  capture:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8.0.1
        with:
          name: game-build
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          name: catalog-plans
          path: artifacts/catalog-plans
      - run: node scripts/catalog.mjs capture-plan --worker=${{ matrix.worker }} ${{ inputs.trusted && '--cache' || '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: asset-captures-${{ matrix.worker }}
          path: artifacts/catalog/
          if-no-files-found: error
          retention-days: 14

  verify-coverage:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: asset-captures-*
          merge-multiple: true
          path: artifacts/catalog
      - run: node scripts/catalog.mjs generate
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: asset-catalog-public
          path: artifacts/catalog-public
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: asset-catalog-complete
          path: artifacts/catalog
          retention-days: 14
