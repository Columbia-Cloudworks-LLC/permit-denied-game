name: Asset visual catalog

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run capture:assets -- --shard=${{ matrix.shard }}/4 --output=artifacts/asset-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-captures-${{ matrix.shard }}
          path: artifacts/asset-captures
          if-no-files-found: error
          retention-days: 14

  verify-coverage:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/verify-asset-captures.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-captures-*
          path: artifacts/catalog
      - run: node scripts/verify-asset-captures.mjs artifacts/catalog
      - uses: actions/upload-artifact@v4
        with:
          name: asset-catalog-complete
          path: artifacts/catalog
          retention-days: 14
