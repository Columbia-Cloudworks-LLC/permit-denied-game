name: Playtest
description: Driving, collapse, rubble, or HUD failed in play.
title: "[Playtest]: "
labels: ["playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the town loads but a play fantasy fails (corner buckle, warehouse push, alley carve, neighbor lean, camera bird).

  - type: dropdown
    id: which-test
    attributes:
      label: Which moment failed
      options:
        - Corner takeout does not buckle
        - Warehouse support grind does not sag the roof
        - Alley house cannot be carved
        - Collapse does not lean into a neighbor
        - Traffic camera / bird / streetlight feel wrong
        - Driving / blade / restart
        - Other feel / readability
    validations:
      required: true

  - type: textarea
    id: session
    attributes:
      label: What you did
      description: Approach, building, roughly when it went wrong.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What went wrong
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra
      description: Screenshot. Drag files onto this field.
    validations:
      required: false
