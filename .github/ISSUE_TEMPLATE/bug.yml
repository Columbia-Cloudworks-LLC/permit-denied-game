name: Bug
description: Crash, wrong controls, scoring, destruction, render, or CI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This is a one-town prototype — read `README.md` before filing.

  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Crash or hang
        - Controls / driving
        - Destruction / collapse
        - Score / cash / timer
        - Rendering / depth / HUD
        - Audio
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `npm run dev`
        2. Open http://localhost:5173
        3. Hold W from spawn
        4. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Browser:
        - How you ran it (`npm run dev` / `npm run preview`):
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra
      description: Screenshots or `npm test` output. Drag files onto this field.
    validations:
      required: false
