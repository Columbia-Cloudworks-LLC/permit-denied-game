name: Change
description: Propose a gameplay, code, or visual change that stays on this one town.
title: "[Change]: "
labels: ["change"]
body:
  - type: markdown
    attributes:
      value: |
        Stay on this town. A change that does not affect driving or demolition probably does not ship.

        Out of spec (do not file): campaign, between-run meta, second town, backend, title names the copy forbids.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays on the current town (no campaign, meta, or second map)
          required: true
        - label: I read `README.md`
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a player cannot do, or which destruction feel fails.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Tune existing numbers
        - Fix existing system
        - Visual / audio
        - Docs only
        - New system (justify)
    validations:
      required: true
