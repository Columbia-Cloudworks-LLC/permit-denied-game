name: Change
description: Propose a gameplay, code, or visual change that stays on the one town generator.
title: "[Change]: "
labels: ["change"]
body:
  - type: markdown
    attributes:
      value: |
        Stay on the one town generator. Overworld counties are seeded variants of the seven campaign levels; a change that does not affect driving, demolition, the campaign, or the overworld probably does not ship.

        Out of spec (do not file): a second town generator or hand-built maps, between-run progression beyond county clears and the capitol unlock, backend, title names the copy forbids.

        Campaign bug reports and campaign maintenance (level timing, landmarks, HUD copy) belong here or in Bug.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays on the one town generator (no second generator, and no between-run progression beyond county clears)
          required: true
        - label: I read `README.md` and `docs/campaign.md` if this touches Time Challenge or the overworld
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a player cannot do, or which destruction or campaign feel fails.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Tune existing numbers
        - Fix existing system
        - Time Challenge campaign maintenance
        - Visual / audio
        - Docs only
        - New system (justify)
    validations:
      required: true
